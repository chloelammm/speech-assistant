<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Speech Assistant Demo 01a</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #fdfaf0; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* 讓筆劃區域看起來像個大按鈕 */
        #character-target { 
            margin: 20px auto; 
            cursor: pointer; /* 滑鼠移上去變小手 */
            transition: transform 0.1s;
            display: inline-block;
        }
        #character-target:active {
            transform: scale(0.95); /* 點擊時有縮小效果，像真實按鈕 */
        }

        .instruction { color: #ff9800; font-weight: bold; font-size: 20px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div style="font-size: 80px;">⚽</div>
    <div class="instruction">👇 點一下字，聽聽看</div>
    
    <div id="character-target" onclick="handleCharClick()"></div>

    <p style="color: #888;">點擊漢字即可朗讀並觀察筆劃</p>
</div>

<script>
    const writer = HanziWriter.create('character-target', '踢', {
        width: 250,
        height: 250,
        padding: 5,
        showOutline: true,
        strokeColor: '#000000',      // 已完成：黑色
        highlightColor: '#ff4757',   // 正在寫：亮紅色 (高對比色)
        strokeAnimationSpeed: 0.2,   // 慢速
        delayBetweenStrokes: 500     
    });

    // 朗讀功能
    function speak(text) {
        // 先取消正在播放的聲音，避免重疊
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-HK';
        msg.rate = 0.8;
        window.speechSynthesis.speak(msg);
    }

    // 點擊漢字後的處理邏輯
    function handleCharClick() {
        // 1. 讀聲
        speak('踢');
        
        // 2. 播放筆劃動畫
        writer.animateCharacter({
            onNextStrokeStart: function() {
                // 每一劃開始時的小提示音
                playTick();
            }
        });
    }

    // 提示音
    function playTick() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.frequency.value = 900; g.gain.value = 0.05;
        osc.start(); osc.stop(ctx.currentTime + 0.05);
    }

    // 初始化讀一次
    window.onload = () => {
        setTimeout(() => speak('踢'), 500);
    };
</script>

</body>
</html>
